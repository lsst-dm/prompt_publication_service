[project]
name = "lsst-prompt-publication-service"
version = "0.1.0"
requires-python = "~= 3.13.0"
dependencies = [
    "aiokafka>=0.13.0",
    "alembic>=1.18.4",
    "click>=8.3.1",
    "lsst-daf-butler",
    "lsst-pipe-base",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[aiosqlite,asyncio,postgresql-asyncpg]>=2.0.48",
    "structlog>=25.5.0",
]

# Pytest configuration required to prevent pytest from looking for
# configurations in parent directories. Can be empty.
[tool.pytest]

[tool.ruff]
line-length = 110
target-version = "py314"
exclude = [
    "doc/"
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["lsst"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
# Formatter does not know about indenting.
docstring-code-line-length = 69

[tool.lsst_versions]
write_to = "python/lsst/prompt_publication_service/version.py"

[tool.mypy]
files = ["python", "tests"]
plugins = "pydantic.mypy"

[[tool.mypy.overrides]]
module = [
    'astropy.*',
    'aiokafka.*',
    'backoff.*'
]
ignore_missing_imports = true

[tool.uv.sources]
lsst-daf-butler = { git = "https://github.com/lsst/daf_butler" }
lsst-pipe-base = { git = "https://github.com/lsst/pipe_base" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
]
